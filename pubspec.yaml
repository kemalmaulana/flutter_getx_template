name: flutter_getx_template
description: Flutter with Getx Template.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  connectivity_plus: ^6.1.4
  dropdown_button2: ^2.3.9
  file_picker: ^10.1.9
  fimber: ^0.7.0
  firebase_core: ^3.13.1
  firebase_crashlytics: ^4.3.6
  firebase_messaging: ^15.2.6
  flutter:
    sdk: flutter
  flutter_alice: ^2.0.1
  flutter_easyloading: ^3.0.5
  flutter_html: any
  flutter_inappwebview: ^6.1.5
  flutter_launcher_icons: ^0.14.3
  flutter_local_notifications: ^19.2.1
  flutter_map: ^8.1.1
  flutter_native_splash: ^2.4.6
  flutter_rating_bar: ^4.0.1
  flutter_screenutil: ^5.9.3
  flutter_staggered_animations: ^1.1.1
  flutter_svg: ^2.1.0
  geolocator: ^14.0.1
  get: ^4.7.2
  get_storage: ^2.1.1
  google_fonts: ^6.2.1
  google_mlkit_face_detection: ^0.13.1
  image_picker: ^1.1.2
  infinite_scroll_pagination: ^5.0.0
  intl: ^0.20.2
  latlong2: ^0.9.1
  maps_toolkit: ^3.1.0
  mask_text_input_formatter: ^2.9.0
  octo_image: ^2.1.0
  overlay_support: ^2.1.0
  path:
  path_provider_android: ^2.2.17
  percent_indicator: ^4.2.5
  permission_handler:
  shimmer: ^3.0.0
  timezone:
  upgrader: ^11.4.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.13.0

dependency_overrides:
  flutter_alice:
    git:
      url: https://github.com/kemalmaulana/flutter-alice.git

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/ic_application.png"
  remove_alpha_ios: true

flutter_native_splash:
  web: false
  color: "#FFFFFF"
  image: "assets/icon/ic_application.png"
  color_dark: "#FFFFFF"

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
#  assets:
#    - assets/images/
#    - assets/icons/
#    - assets/vector/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
